### Generated by scripts/generate_swarm_config.py
# Message type support: include/ros_sub_pub.hpp

### list all <IPname: IP> here ###
IP:
  self: '*'   # '*' stands for all self IPs
  robot1: 192.168.0.121
  robot2: 192.168.0.195
  robot3: 192.168.0.243
  gcs: 192.168.0.137

####### Send these ROS messages to remote robots #######
send_topics:
  # 将地面站 RViz 产生的 "2D Nav Goal" 广播出去，作为集群起飞触发信号
  - topic_name: /move_base_simple/goal
    msg_type: geometry_msgs/PoseStamped
    max_freq: 10
    srcIP: gcs
    srcPort: 5099  # 为 Trigger 分配一个独立端口，避免冲突

  # 任务级降落请求：由地面站前端发布 Bool(True)，桥接转发到 1 号无人机
  - topic_name: /uav1/mission/land_request
    msg_type: std_msgs/Bool
    max_freq: 50
    srcIP: gcs
    srcPort: 5098  # send_topics 的端口必须互不相同

  # 任务级降落请求：由地面站前端发布 Bool(True)，桥接转发到 2 号无人机
  - topic_name: /uav2/mission/land_request
    msg_type: std_msgs/Bool
    max_freq: 50
    srcIP: gcs
    srcPort: 5097  # send_topics 的端口必须互不相同

  # 任务级降落请求：由地面站前端发布 Bool(True)，桥接转发到 3 号无人机
  - topic_name: /uav3/mission/land_request
    msg_type: std_msgs/Bool
    max_freq: 50
    srcIP: gcs
    srcPort: 5096  # send_topics 的端口必须互不相同

