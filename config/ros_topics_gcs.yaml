### default supported ROS message types:
# sensor_msgs/Imu
# geometry_msgs/Twist
# std_msgs/String

### list all <IPname: IP> here ###
IP:
  self: '*'   # '*' stands for all self IPs
  robot1: 192.168.0.121    # 务必确认实飞时无人机 1 的 IP
  robot2: 192.168.0.195    # 务必确认实飞时无人机 2 的 IP
  robot3: 192.168.0.243    # 务必确认实飞时无人机 3 的 IP
  gcs: 192.168.0.137       # 地面站自己的 IP 

  # robot1: 172.20.10.2    # 务必确认实飞时无人机 1 的 IP
  # robot2: 172.20.10.3    # 务必确认实飞时无人机 2 的 IP
  # gcs: 172.20.10.6        # 地面站自己的 IP 

####### Send these ROS messages to remote robots #######
send_topics:
  # 将地面站 RViz 产生的 "2D Nav Goal" 广播出去，作为集群起飞触发信号
  - topic_name: /move_base_simple/goal
    msg_type: geometry_msgs/PoseStamped
    max_freq: 10
    srcIP: gcs
    srcPort: 5099  # 为 Trigger 分配一个独立端口，避免冲突

  # 任务级降落请求：由地面站前端发布 Bool(True)，桥接转发到各无人机
  - topic_name: /uav1/mission/land_request
    msg_type: std_msgs/Bool
    max_freq: 50
    srcIP: gcs
    srcPort: 5098  # send_topics 的端口必须互不相同

  - topic_name: /uav2/mission/land_request
    msg_type: std_msgs/Bool
    max_freq: 50
    srcIP: gcs
    srcPort: 5097  # send_topics 的端口必须互不相同
    
  - topic_name: /uav3/mission/land_request
    msg_type: std_msgs/Bool
    max_freq: 50
    srcIP: gcs
    srcPort: 5096  # send_topics 的端口必须互不相同


####### receive these ROS messages from remote robots #######
recv_topics:
  # ==========================================
  # 接收来自 无人机 1 (Robot 1) 的所有数据
  # ==========================================
