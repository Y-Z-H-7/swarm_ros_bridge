    srcIP: robot1
    srcPort: 5004

  # # 接收分层网格信息
  - topic_name: /swarm_expl/hgrid_recv_1
    msg_type: exploration_manager/HGrid
    srcIP: robot1
    srcPort: 5005

  # # 接收当前网格巡航序列
  - topic_name: /swarm_expl/grid_tour_recv_1
