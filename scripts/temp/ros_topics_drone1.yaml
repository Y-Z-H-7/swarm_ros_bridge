### default supported ROS message types:
# sensor_msgs/Imu
# geometry_msgs/Twist
# std_msgs/String

### 无人机 1 (Robot 1) 的桥接配置 ###
### 自动生成 — 请确认 IP 是否正确 ###
IP:
  self: '*'   # '*' stands for all self IPs
  robot1: 192.0.0.1
  robot2: 192.0.0.1
  robot3: 192.0.0.1
  gcs: 192.0.0.1

####### Send these ROS messages to GCS — 无人机 1 (Robot 1) #######
send_topics:
  - topic_name: /swarm_expl/drone_state_recv_1
    msg_type: exploration_manager/DroneState
    max_freq: 50
    srcIP: self
    srcPort: 5001

  - topic_name: /swarm_expl/pair_opt_recv_1
    msg_type: exploration_manager/PairOpt
    max_freq: 50
    srcIP: self
    srcPort: 5002

  - topic_name: /swarm_expl/pair_opt_res_recv_1
    msg_type: exploration_manager/PairOptResponse
    max_freq: 50
    srcIP: self
    srcPort: 5003

  - topic_name: /planning/swarm_traj_recv_1
    msg_type: bspline/Bspline
    max_freq: 50
    srcIP: self
    srcPort: 5004

  - topic_name: /swarm_expl/hgrid_recv_1
    msg_type: exploration_manager/HGrid
    max_freq: 50
    srcIP: self
    srcPort: 5005

  - topic_name: /swarm_expl/grid_tour_recv_1
    msg_type: exploration_manager/GridTour
    max_freq: 50
    srcIP: self
    srcPort: 5006

  - topic_name: /multi_map_manager/chunk_stamps_recv_1
    msg_type: plan_env/ChunkStamps
    max_freq: 50
    srcIP: self
    srcPort: 5007

  - topic_name: /multi_map_manager/chunk_data_recv_1
    msg_type: plan_env/ChunkData
    max_freq: 50
    srcIP: self
    srcPort: 5008

  - topic_name: /planning_vis/viewpoints_1
    msg_type: visualization_msgs/Marker
    max_freq: 50
    srcIP: self
    srcPort: 5009

  - topic_name: /sdf_map/occupancy_all_1
    msg_type: sensor_msgs/PointCloud2
    max_freq: 50
    srcIP: self
    srcPort: 5010

  - topic_name: /planning/travel_traj_1
    msg_type: visualization_msgs/Marker
    max_freq: 50
    srcIP: self
    srcPort: 5011

  - topic_name: /planning/position_cmd_vis_1
    msg_type: visualization_msgs/Marker
    max_freq: 50
    srcIP: self
    srcPort: 5012

####### receive these ROS messages from GCS and other robots #######
recv_topics:
  # ==========================================
  # 接收来自 地面站 (GCS) 的指令
  # ==========================================

  # 2D Nav Goal — 起飞/集群触发信号
  - topic_name: /move_base_simple/goal
    msg_type: geometry_msgs/PoseStamped
    srcIP: gcs
    srcPort: 5099

  # 本机专属降落请求
  - topic_name: /uav1/mission/land_request
    msg_type: std_msgs/Bool
    srcIP: gcs
    srcPort: 5098

  # ==========================================
  # 接收来自 无人机 2 (Robot 2) 的数据
